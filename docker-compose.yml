services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    mem_limit: 128m

  frontend:
    build: ./frontend
    expose:
      - "3000"
    restart: unless-stopped
    mem_limit: 256m

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_BASE_URL=https://priv.bardsec.com
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 64m

volumes:
  redis_data:
