events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;  # Docker internal DNS

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

    # Concurrent connection limit zone
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # Cap concurrent connections per IP across all locations
        limit_conn addr 20;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Auth endpoints — proxied to backend
        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints — proxied to backend
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Drop common vulnerability scanner probes immediately (no response = less work)
        location ~* ^/(\.env|\.git|\.svn|\.htpasswd|\.htaccess|\.ssh|id_rsa|wp-admin|wp-login|phpinfo|\.php$|actuator|\.aws|\.npmrc|\.yarnrc|\.netrc|\.pgpass|\.my\.cnf|database\.(sql|yml)|backup\.sql|dump\.sql|db\.sql) {
            return 444;
        }

        # Frontend — served from React build
        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Pass through cache headers for static assets
            proxy_cache_bypass $http_upgrade;
        }
    }
}
